name: Daily Database Backup (.sql)

on:
  schedule:
    # Runs everyday at 1:35 PM Malaysia time (05:35 UTC)
    - cron: '0 7 * * *'
  # Allows triggering the backup manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set Backup Timestamp
        id: timestamp
        run: |
          echo "BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install PostgreSQL 17 Client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Generate PostgreSQL Database Dump
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          OUTPUT_SQL: backups/salon_backup_${{ env.BACKUP_DATE }}.sql
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub repository settings!"
            echo "Please go to: Settings -> Secrets and variables -> Actions -> New repository secret -> DATABASE_URL"
            exit 1
          fi

          mkdir -p backups
          export OUTPUT_SQL="backups/salon_backup_${BACKUP_DATE}.sql"

          # Use Node.js for safe URL parsing (immune to special characters in passwords)
          node - << 'EOF'
          const { execSync } = require('child_process');
          const rawUrl = process.env.DATABASE_URL.trim();
          const outputFile = process.env.OUTPUT_SQL || `backups/salon_backup_${process.env.BACKUP_DATE}.sql`;

          function getCandidates(inputUrl) {
            try {
              const u = new URL(inputUrl);
              u.searchParams.delete('pgbouncer');
              u.searchParams.delete('connection_limit');
              u.searchParams.delete('pool_timeout');

              const list = [];

              // 1. Supabase Direct Host (bypasses pooler connection limits)
              if (u.username.startsWith('postgres.') && u.hostname.includes('pooler.supabase.com')) {
                const ref = u.username.split('.')[1];
                const direct = new URL(u.toString());
                direct.hostname = `db.${ref}.supabase.co`;
                direct.username = 'postgres';
                direct.port = '5432';
                list.push({ name: 'Supabase Direct Host (port 5432)', url: direct.toString() });
              }

              // 2. Pooler Port 6543 (transaction mode without pgbouncer param)
              const pooler6543 = new URL(u.toString());
              pooler6543.port = '6543';
              list.push({ name: 'Supabase Pooler (port 6543)', url: pooler6543.toString() });

              // 3. Pooler Port 5432 (session mode)
              const pooler5432 = new URL(u.toString());
              pooler5432.port = '5432';
              list.push({ name: 'Supabase Pooler (port 5432)', url: pooler5432.toString() });

              return list;
            } catch (err) {
              return [{ name: 'Raw URL', url: inputUrl }];
            }
          }

          const fs = require('fs');
          const pgDumpCmd = fs.existsSync('/usr/lib/postgresql/17/bin/pg_dump')
            ? '/usr/lib/postgresql/17/bin/pg_dump'
            : 'pg_dump';

          const candidates = getCandidates(rawUrl);
          let ok = false;

          for (const cand of candidates) {
            console.log(`Connecting via ${cand.name}...`);
            try {
              execSync(
                `"${pgDumpCmd}" "${cand.url}" --no-owner --no-privileges --clean --if-exists --encoding=UTF8 --file="${outputFile}"`,
                { stdio: 'inherit' }
              );
              console.log(`✓ Database backup dump succeeded via ${cand.name}!`);
              ok = true;
              break;
            } catch (err) {
              console.warn(`✗ ${cand.name} failed, trying next candidate...`);
            }
          }

          if (!ok) {
            console.error('All database connection candidates failed.');
            process.exit(1);
          }
          EOF

          echo "Compressing backup file..."
          gzip -c "$OUTPUT_SQL" > "${OUTPUT_SQL}.gz"

          echo "Backup created successfully:"
          ls -lh backups/

      - name: Upload Backup to GitHub Artifacts (Retained for 60 days)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_DATE }}
          path: backups/salon_backup_${{ env.BACKUP_DATE }}.sql.gz
          retention-days: 60
          if-no-files-found: error
