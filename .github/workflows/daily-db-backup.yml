name: Daily Database Backup (.sql)

on:
  schedule:
    # Runs everyday at 1:35 PM Malaysia time (05:35 UTC)
    - cron: '52 5 * * *'
  # Allows triggering the backup manually anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set Backup Timestamp
        id: timestamp
        run: |
          echo "BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Generate PostgreSQL Database Dump
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub repository settings!"
            echo "Please go to: Settings -> Secrets and variables -> Actions -> New repository secret -> DATABASE_URL"
            exit 1
          fi

          mkdir -p backups
          OUTPUT_SQL="backups/salon_backup_${BACKUP_DATE}.sql"

          # Clean the URL by stripping Prisma query parameters
          CLEAN_URL=$(echo "$DATABASE_URL" | sed -E 's/[?&](pgbouncer|connection_limit|pool_timeout)=[^&]*//g' | sed -e 's/\?&/?/' -e 's/\?$//')

          # Derive Supabase Direct Connection URL (port 5432 directly to db host, bypasses pooler connection limits)
          # Converts: postgresql://postgres.REF:PASS@aws-0-ap-southeast-1.pooler.supabase.com:.../postgres
          # Into:     postgresql://postgres:PASS@db.REF.supabase.co:5432/postgres
          DIRECT_URL=$(echo "$CLEAN_URL" | sed -E 's|postgresql://postgres\.([^:]+):([^@]+)@[^:]+:(6543|5432)/|postgresql://postgres:\2@db.\1.supabase.co:5432/|')

          SUCCESS=0

          # 1. Try Direct Supabase Connection first (no pooler limit!)
          if [[ "$DIRECT_URL" != "$CLEAN_URL" ]]; then
            echo "Attempting dump via Supabase direct host..."
            if pg_dump "$DIRECT_URL" --no-owner --no-privileges --clean --if-exists --encoding=UTF8 --file="$OUTPUT_SQL" 2>/dev/null; then
              SUCCESS=1
              echo "Direct dump successful!"
            else
              echo "Direct host connection not reachable, trying pooler..."
            fi
          fi

          # 2. Fallback to port 6543 (transaction pooler)
          if [ $SUCCESS -eq 0 ]; then
            URL_6543=$(echo "$CLEAN_URL" | sed -e 's/:5432\//:6543\//')
            echo "Attempting dump via pooler port 6543..."
            if pg_dump "$URL_6543" --no-owner --no-privileges --clean --if-exists --encoding=UTF8 --file="$OUTPUT_SQL" 2>/dev/null; then
              SUCCESS=1
              echo "Pooler 6543 dump successful!"
            fi
          fi

          # 3. Final fallback: retry standard URL
          if [ $SUCCESS -eq 0 ]; then
            echo "Attempting final dump via standard connection..."
            pg_dump "$CLEAN_URL" --no-owner --no-privileges --clean --if-exists --encoding=UTF8 --file="$OUTPUT_SQL"
          fi

          echo "Compressing backup file..."
          gzip -c "$OUTPUT_SQL" > "${OUTPUT_SQL}.gz"

          echo "Backup created successfully:"
          ls -lh backups/

      - name: Upload Backup to GitHub Artifacts (Retained for 60 days)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_DATE }}
          path: backups/salon_backup_${{ env.BACKUP_DATE }}.sql.gz
          retention-days: 60
          if-no-files-found: error
