version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL — local development database
  # (In production, replace DATABASE_URL with your Supabase/VPS DSN
  #  and remove this service entirely)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bookease_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Next.js application
  # ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookease_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bookingdb
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-BookEase}
      NEXT_PUBLIC_MERCHANT_WHATSAPP: ${NEXT_PUBLIC_MERCHANT_WHATSAPP:-60123456789}
      NEXT_PUBLIC_PAYMENT_QR_URL: ${NEXT_PUBLIC_PAYMENT_QR_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
