services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-external}
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-BookEase}
        NEXT_PUBLIC_MERCHANT_WHATSAPP: ${NEXT_PUBLIC_MERCHANT_WHATSAPP:-60123456789}
        NEXT_PUBLIC_PAYMENT_QR_URL: ${NEXT_PUBLIC_PAYMENT_QR_URL:-}
        NEXT_PUBLIC_BOOKING_REF_PREFIX: ${NEXT_PUBLIC_BOOKING_REF_PREFIX:-BK}
        NEXT_PUBLIC_OPERATING_HOUR_START: ${NEXT_PUBLIC_OPERATING_HOUR_START:-9}
        NEXT_PUBLIC_OPERATING_HOUR_END: ${NEXT_PUBLIC_OPERATING_HOUR_END:-19}
        NEXT_PUBLIC_CLOSED_DAYS: ${NEXT_PUBLIC_CLOSED_DAYS:-0}
        NEXT_PUBLIC_OPERATING_DAYS_DESCRIPTION: ${NEXT_PUBLIC_OPERATING_DAYS_DESCRIPTION:-Mon – Sat}
        NEXT_PUBLIC_OPERATING_HOURS_DISPLAY: ${NEXT_PUBLIC_OPERATING_HOURS_DISPLAY:-9:00 AM – 7:00 PM}
        NEXT_PUBLIC_CURRENCY_SYMBOL: ${NEXT_PUBLIC_CURRENCY_SYMBOL:-RM}
        NEXT_PUBLIC_CURRENCY_CODE: ${NEXT_PUBLIC_CURRENCY_CODE:-MYR}
        NEXT_PUBLIC_BUSINESS_TIMEZONE: ${NEXT_PUBLIC_BUSINESS_TIMEZONE:-Asia/Kuala_Lumpur}
    container_name: salon-prod
    restart: unless-stopped
    ports:
      # Bound to localhost on 3001 (avoids conflict with nextjs-prod on 3000);
      # point Nginx to http://127.0.0.1:3001
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    env_file:
      - .env.prod
    networks:
      - internal-net

networks:
  internal-net:
    external: true
    name: florist-white-label-frontend_internal-net
